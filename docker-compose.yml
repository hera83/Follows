services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: follows-web:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

      # AppSettings (see web/appsettings.json for the full key list)
      AppSettings__SiteName: ${SITE_NAME:-Follows}
      AppSettings__AllowPublicRegistration: ${ALLOW_PUBLIC_REGISTRATION:-false}
      AppSettings__DefaultThemeMode: ${DEFAULT_THEME_MODE:-System}

      # Mail (SMTP/IMAP) - leave blank to keep mail features disabled
      Mail__Smtp__Host: ${MAIL_SMTP_HOST:-}
      Mail__Smtp__Port: ${MAIL_SMTP_PORT:-587}
      Mail__Smtp__SecureSocketOptions: ${MAIL_SMTP_SECURE:-StartTls}
      Mail__Smtp__Username: ${MAIL_SMTP_USERNAME:-}
      Mail__Smtp__Password: ${MAIL_SMTP_PASSWORD:-}
      Mail__Smtp__FromAddress: ${MAIL_SMTP_FROM_ADDRESS:-}
      Mail__Smtp__FromName: ${MAIL_SMTP_FROM_NAME:-}
      Mail__Imap__Host: ${MAIL_IMAP_HOST:-}
      Mail__Imap__Port: ${MAIL_IMAP_PORT:-993}
      Mail__Imap__SecureSocketOptions: ${MAIL_IMAP_SECURE:-SslOnConnect}
      Mail__Imap__Username: ${MAIL_IMAP_USERNAME:-}
      Mail__Imap__Password: ${MAIL_IMAP_PASSWORD:-}

      # AI Gateway - leave blank to keep it disabled
      AiGateway__BaseUrl: ${AI_GATEWAY_BASE_URL:-}
      AiGateway__ApiKey: ${AI_GATEWAY_API_KEY:-}
      AiGateway__DefaultChatModel: ${AI_GATEWAY_DEFAULT_CHAT_MODEL:-}
      AiGateway__DefaultLanguage: ${AI_GATEWAY_DEFAULT_LANGUAGE:-Dansk}
      AiGateway__DefaultTtsModel: ${AI_GATEWAY_DEFAULT_TTS_MODEL:-}
      AiGateway__DefaultTtsVoice: ${AI_GATEWAY_DEFAULT_TTS_VOICE:-}
      AiGateway__DefaultSttModel: ${AI_GATEWAY_DEFAULT_STT_MODEL:-}
      # Chat model used specifically for translation (Documents page "Oversæt"-button + Feed's
      # post/comment auto-translate) instead of DefaultChatModel above — set this to a non-reasoning/
      # non-"thinking" model. Leave blank to just use DefaultChatModel. See
      # AiGatewaySettings.TranslationModel for why this exists.
      AiGateway__TranslationModel: ${AI_GATEWAY_TRANSLATION_MODEL:-}
      AiGateway__RequestTimeoutSeconds: ${AI_GATEWAY_REQUEST_TIMEOUT_SECONDS:-600}

      # Ollama - leave blank to keep it disabled
      Ollama__BaseUrl: ${OLLAMA_BASE_URL:-}
      Ollama__ApiKey: ${OLLAMA_API_KEY:-}
      Ollama__DefaultChatModel: ${OLLAMA_DEFAULT_CHAT_MODEL:-}
      Ollama__DefaultGenerateModel: ${OLLAMA_DEFAULT_GENERATE_MODEL:-}
      Ollama__DefaultEmbeddingModel: ${OLLAMA_DEFAULT_EMBEDDING_MODEL:-}
      Ollama__DefaultKeepAlive: ${OLLAMA_DEFAULT_KEEP_ALIVE:-}
      Ollama__DefaultLanguage: ${OLLAMA_DEFAULT_LANGUAGE:-Dansk}
      Ollama__UseStreamingByDefault: ${OLLAMA_USE_STREAMING_BY_DEFAULT:-false}
      Ollama__RequestTimeoutSeconds: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-600}

      # SMS - leave blank to keep it disabled
      Sms__BaseUrl: ${SMS_BASE_URL:-}
      Sms__ApiKey: ${SMS_API_KEY:-}
      Sms__WorkerIntervalSeconds: ${SMS_WORKER_INTERVAL_SECONDS:-30}

      # Video transcoding (feed video → H.264, so HEVC phone uploads play reliably in-browser).
      # ffmpeg is baked into the image (see Dockerfile) so FfmpegPath just needs to find it on PATH.
      VideoTranscode__FfmpegPath: ${VIDEO_TRANSCODE_FFMPEG_PATH:-ffmpeg}
      VideoTranscode__WorkerIntervalSeconds: ${VIDEO_TRANSCODE_WORKER_INTERVAL_SECONDS:-15}
      VideoTranscode__TimeoutMinutes: ${VIDEO_TRANSCODE_TIMEOUT_MINUTES:-20}
    volumes:
      # Named volumes: Docker seeds them from /app/App_dbs and /app/App_files
      # in the image on first start, which preserves the non-root "app" user
      # ownership set in the Dockerfile. Prefer these over bind mounts unless
      # you specifically need direct host filesystem access (in which case
      # remember to chown the host folders to match the container's "app"
      # user, e.g. `docker compose exec web id app`).
      - app_dbs:/app/App_dbs
      - app_files:/app/App_files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/Account/Login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  app_dbs:
  app_files:
